name: CI Automation & Release Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      suiteFile:
        description: 'TestNG Suite XML to execute'
        required: true
        default: 'testng-smoke.xml'
        type: choice
        options:
          - testng-smoke.xml
          - testng.xml

jobs:
  qa-regression-gate:
    name: Automated Regression Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verify Google Chrome Installation
        run: |
          google-chrome --version || echo "Google Chrome pre-installed on GitHub runner"

      - name: Install Xvfb (Virtual Display for Headed Chrome)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb

      - name: Execute Automated Test Suite (Release Quality Gate)
        env:
          INPUT_SUITE: ${{ github.event.inputs.suiteFile }}
        run: |
          SUITE="${INPUT_SUITE:-testng-smoke.xml}"
          echo "Executing test suite: ${SUITE}"
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" mvn clean test "-DsuiteFile=${SUITE}" "-DmockServer=true" "-Dheadless=false"

      - name: Generate Allure HTML Report
        if: always()
        run: |
          mvn allure:report || echo "Allure report generation skipped"

      - name: Archive Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
          retention-days: 14

      - name: Archive Failure Screenshots Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-screenshots
          path: test-output/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Archive Allure Raw Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Archive Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: target/site/allure-maven-plugin/
          if-no-files-found: ignore
          retention-days: 14

